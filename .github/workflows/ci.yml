name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on purpose. Granularity belongs in the flake's `checks.*`
  # attributes, which `nix flake check` evaluates in parallel with build
  # caching. Splitting these into separate GitHub jobs would duplicate that
  # scheduling and lose cache sharing between them.
  #
  # Add a second job ONLY for work the Nix sandbox cannot do: network access,
  # a real PTY/TTY, artifact upload, or a different runner OS.
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # persist-credentials: false — this job runs untrusted PR code via
      # `nix flake check`, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout ANSI-test
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pfdietz/ansi-test
          ref: 6e3f70002559d56d3e4a6f0b8ddcc083d202f066
          path: .ci/ansi-test
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Probe ANSI-test eval and compile drivers
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          ANSI_SOURCE: ${{ github.workspace }}/.ci/ansi-test
        run: |
          set -euo pipefail
          nix run "$GITHUB_WORKSPACE#load"
          nix build "$GITHUB_WORKSPACE#default" --out-link "$RUNNER_TEMP/cl-cc"

          eval_dir="$RUNNER_TEMP/ansi-test-eval"
          compile_dir="$RUNNER_TEMP/ansi-test-compile"
          mkdir -p "$eval_dir" "$compile_dir"
          cp -R "$ANSI_SOURCE/." "$eval_dir/"
          cp -R "$ANSI_SOURCE/." "$compile_dir/"

          eval_status=0
          (cd "$eval_dir" && "$RUNNER_TEMP/cl-cc/bin/cl-cc" run --lang lisp --no-timeout ./doit.lsp) || eval_status=$?
          compile_status=0
          (cd "$compile_dir" && "$RUNNER_TEMP/cl-cc/bin/cl-cc" run --lang lisp --no-timeout ./compileit.lsp) || compile_status=$?

          printf 'doit.lsp exit: %s\n' "$eval_status"
          printf 'compileit.lsp exit: %s\n' "$compile_status"
          test "$eval_status" -eq 0
          test "$compile_status" -eq 0

      # Runs the SBCL test suite (checks.default), the treefmt formatting gate
      # (checks.formatting), and the mkdocs --strict build (checks.docs).
      # Add `--all-systems` only when the flake declares more than one system.
      - name: Check flake
        run: nix flake check --print-build-logs

      # Catches stray conflict markers and whitespace errors that compile fine.
      - name: Check diff hygiene
        run: git diff --check
