name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phpt:
    name: PHPT group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [0, 1, 2, 3, 4, 5]
    steps:
      # persist-credentials: false — this job runs untrusted PR code via Nix
      # builds, and never needs the token, so don't leave it in
      # .git/config for that code to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build assigned PHPT shards
        env:
          PHPT_MATRIX_GROUP: ${{ matrix.group }}
        shell: bash
        run: |
          mapfile -t checks < <(
            nix eval --json .#checks.x86_64-linux --apply 'builtins.attrNames' |
              python3 -c '
          import json
          import os
          import sys

          group = int(os.environ["PHPT_MATRIX_GROUP"])
          names = sorted(name for name in json.load(sys.stdin) if name.startswith("phpt-"))
          selected = [name for index, name in enumerate(names) if index % 6 == group]
          if len(names) != 61 or not selected:
              raise SystemExit(f"expected 61 PHPT shards and a nonempty group; found {len(names)} shards and {len(selected)} in group {group}")
          for name in selected:
              print(f".#checks.x86_64-linux.{name}")
          '
          )
          test "${#checks[@]}" -gt 0
          printf 'Building %s PHPT checks in matrix group %s\n' "${#checks[@]}" "$PHPT_MATRIX_GROUP"
          printf '  %s\n' "${checks[@]}"
          nix build --no-link --print-build-logs --option keep-going true --option max-jobs 1 "${checks[@]}"

  other-checks:
    name: Other flake checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Evaluate all flake checks
        run: nix flake check --no-build --print-build-logs --keep-going

      - name: Build non-PHPT checks
        shell: bash
        run: |
          mapfile -t checks < <(
            nix eval --json .#checks.x86_64-linux --apply 'builtins.attrNames' |
              python3 -c '
          import json
          import sys

          names = sorted(name for name in json.load(sys.stdin) if not name.startswith("phpt-"))
          if not names:
              raise SystemExit("expected non-PHPT flake checks")
          for name in names:
              print(f".#checks.x86_64-linux.{name}")
          '
          )
          test "${#checks[@]}" -gt 0
          printf 'Building %s non-PHPT checks\n' "${#checks[@]}"
          nix build --no-link --print-build-logs --option keep-going true --option max-jobs 1 "${checks[@]}"

      - name: Check diff hygiene
        run: git diff --check

  check:
    name: nix flake check
    if: always()
    needs: [phpt, other-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both check groups to pass
        env:
          PHPT_RESULT: ${{ needs.phpt.result }}
          OTHER_CHECKS_RESULT: ${{ needs.other-checks.result }}
        run: |
          test "$PHPT_RESULT" = success
          test "$OTHER_CHECKS_RESULT" = success
