name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same PR; never cancel a push to the default
# branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on purpose. Granularity belongs in the flake's `checks.*`
  # attributes, which `nix flake check` evaluates in parallel with build
  # caching. Splitting these into separate GitHub jobs would duplicate that
  # scheduling and lose cache sharing between them.
  #
  # Add a second job ONLY for work the Nix sandbox cannot do: network access,
  # a real PTY/TTY, artifact upload, or a different runner OS.
  check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Keep checkout credentials out of .git/config because nix flake check
      # executes PR code. Cachix credentials are configured separately below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Isolate adaptive optimizer tests
        id: optimizer-diagnostics
        env:
          CL_CC_TEST_WORKERS: "1"
        run: |
          # The previous fatal stack ended in MAKE-LIST. Run each non-empty
          # adaptive-budget case separately; the adjacent min-floor case uses NIL.
          failed=0
          for case_name in \
            "adaptive-max-iterations-regions tiny" \
            "adaptive-max-iterations-regions small" \
            "adaptive-max-iterations-regions medium" \
            "adaptive-max-iterations-regions large" \
            "adaptive-max-iterations-regions huge" \
            "adaptive-max-iterations-respects-max-cap"
          do
            printf '# diagnostic case: %s\n' "$case_name"
            if nix run .#test --print-build-logs -- --filter "$case_name" --diagnostic-optimize-core; then
              printf '# diagnostic case passed: %s\n' "$case_name"
            else
              status=$?
              printf '# diagnostic case failed (exit %s): %s\n' "$status" "$case_name" >&2
              printf '::error title=Adaptive optimizer diagnostic failed::%s (exit %s)\n' "$case_name" "$status"
              failed=1
            fi
          done
          exit "$failed"

      # Evaluates the flake's declared checks for this runner's system.
      - name: Check flake
        if: ${{ success() || steps.optimizer-diagnostics.outcome == 'failure' }}
        run: nix flake check --print-build-logs

      # Detects whitespace errors in the diff.
      - name: Check diff hygiene
        run: git diff --check
